
site_name: Mein TestWissensgraph
site_description: Enterprise Knowledge Graph & Dokumentation mit Filmen und Büchern

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
    - scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

markdown_extensions:
  - attr_list
  - md_in_html
  - meta

plugins:
  - search
